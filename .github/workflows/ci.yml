name: CI

on:
  push:
    branches: [main]
  pull_request:
    # All PRs, so worker PRs into claude/<phase>-integration branches are checked too.

jobs:
  check:
    name: Typecheck + Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
